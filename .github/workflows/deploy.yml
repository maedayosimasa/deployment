name: Deploy to EC2

# 手動実行(workflow_dispatch)のみ。bim-aiagent01/Legal-Knowledge-Builderの
# 同名ワークフローと異なり、push時の自動発火はさせない。
#
# 理由: このリポジトリの変更(Caddyfile・docker-compose.yml群)は影響範囲が
# サイト全体(Caddy・TLS・Basic認証・全コンテナの構成)に及び、変更頻度も
# 低いため、pushした瞬間に無条件で本番反映されるより、内容を確認してから
# 手動でボタンを押して反映する方が安全と判断した(2026-09-05)。
#
# 既知の落とし穴への対応: Caddyfileはbind mountされているため、
# `docker compose up -d`だけでは内容変更が検知されずbim_caddyコンテナが
# 再作成されない(実機で発覚済み)。そのため`docker compose up -d --build`
# の後、必ず明示的に`docker restart bim_caddy`を行う。ただし壊れた
# Caddyfileをそのまま反映して本番を止めないよう、再起動の前に
# `caddy validate`で構文チェックし、失敗時はデプロイ全体を失敗させて
# (古いCaddyプロセスは動いたままにして)反映しない。
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Deploy via SSM Run Command
        env:
          INSTANCE_ID: i-0a2270fb64b02eecd
        run: |
          set -e

          cat > /tmp/ssm-params.json <<'EOF'
          {
            "commands": [
              "sudo -u ubuntu -H bash -lc 'set -e; cd /home/ubuntu/bim_ai_agent/deployment; git fetch origin; git reset --hard origin/main; docker compose up -d --build; docker exec bim_caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile; docker restart bim_caddy'"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy deployment@${GITHUB_SHA:0:7} via GitHub Actions (manual)" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # `aws ssm wait command-executed` は5秒間隔で最大20回(100秒)しか
          # 待たないため、自前で最大10分ポーリングする
          # (bim-aiagent01/.github/workflows/deploy.ymlと同じ理由)。
          STATUS="InProgress"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            if [ "$STATUS" != "Pending" ] && [ "$STATUS" != "InProgress" ]; then
              break
            fi
            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}" \
            --output json

          if [ "$STATUS" != "Success" ]; then
            echo "Deploy failed with status: $STATUS"
            exit 1
          fi
